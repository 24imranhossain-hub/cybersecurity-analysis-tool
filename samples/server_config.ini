; Sample server configuration used to test vuln_scanner.py
; It is intentionally insecure - do NOT use these settings on a real server.
[ssh]
Port = 22
PermitRootLogin = yes
PasswordAuthentication = yes

[services]
telnet = enabled
ftp = disabled
http = enabled

[password_policy]
min_length = 8
max_failed_attempts = 10

[files]
shadow_permissions = 644
